# eatherahmed.com — Next.js portfolio (reverse proxy to Node)
# Place in /etc/httpd/conf.d/eatherahmed.conf
# Does not affect other vhosts (heictojpg, domainchecker, etc.)

<VirtualHost *:80>
    ServerName eatherahmed.com
    ServerAlias www.eatherahmed.com

    # Blog uploads served directly by Apache (persistent on disk)
    Alias /uploads /var/www/eatherahmed/public/uploads
    <Directory /var/www/eatherahmed/public/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    # Do not proxy /uploads — use Alias above
    ProxyPass /uploads !
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Required for Next.js auth cookies and redirects behind Apache
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog /var/log/httpd/eatherahmed-error.log
    CustomLog /var/log/httpd/eatherahmed-access.log combined
</VirtualHost>
